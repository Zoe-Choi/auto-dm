[package]
name = "auto-dm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
minijinja = { version = "3.0.5", features = ["serde"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls", "charset", "http2", "system-proxy"] }
rusqlite = "0.41.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tower = { version = "0.5.3", features = ["util"] }

[features]
default = ["bundled-sqlite"]
# Compiles SQLite from source; needs a C compiler such as MinGW gcc or MSVC.
bundled-sqlite = ["rusqlite/bundled"]
